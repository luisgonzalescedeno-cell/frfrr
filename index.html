<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPv6 – Luis Alejandro Gonzales Cedeño</title>
<style>
  :root {
    --bg-main: #f8fafc;
    --text-main: #0f172a;
    --navy-blue: #1e3a8a;
    --bright-blue: #0284c7;
    --light-blue-bg: #e0f2fe;
    --emerald-green: #059669;
    --light-green-bg: #d1fae5;
    --alert-red: #dc2626;
    --light-red-bg: #fee2e2;
    --card-border: #cbd5e1;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #090d16;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: var(--text-main);
  }

  #stage {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 960px;
    height: 540px;
    transform-origin: center;
    overflow: hidden;
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.4);
    border-radius: 8px;
  }

  .slide {
    position: absolute;
    inset: 0;
    display: none;
    padding: 40px;
    box-sizing: border-box;
  }
  .slide.on { display: block; }

  /* Posicionamiento y diseño de elementos */
  .el {
    position: absolute;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    white-space: pre-line;
    line-height: 1.25;
  }

  .el.hide {
    visibility: hidden;
    opacity: 0;
  }

  /* Animaciones controladas (se ejecutan una sola vez) */
  .el.animate-fadeIn {
    animation: fadeIn 0.4s ease-out forwards;
  }
  .el.animate-wipe {
    animation: wipeIn 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
  }
  .el.animate-pop {
    animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes wipeIn {
    from { clip-path: inset(0 100% 0 0); opacity: 1; }
    to { clip-path: inset(0 0 0 0); opacity: 1; }
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
  }

  /* Interactividad de botones */
  .el.link {
    cursor: pointer;
    user-select: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .el.link:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(2, 132, 199, 0.25);
  }

  /* Barra de control inferior (HUD) */
  #hud {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 36px;
    background: #0f172a;
    color: #f1f5f9;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 20px;
    font: 13px/1.2 'Segoe UI', sans-serif;
    border-top: 1px solid #1e293b;
    z-index: 100;
  }

  .nav-btn {
    background: #1e293b;
    color: #ffffff;
    border: 1px solid #334155;
    padding: 4px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    margin-left: 6px;
  }
  .nav-btn:hover { background: var(--bright-blue); border-color: var(--bright-blue); }

  /* Destacado de sintaxis */
  .txt-red { color: var(--alert-red); font-weight: 700; }
  .txt-green { color: var(--emerald-green); font-weight: 700; }
  .txt-blue { color: var(--bright-blue); font-weight: 700; }
</style>
</head>
<body>

<div id="stage"></div>

<div id="hud">
  <div><strong>Autor:</strong> Luis Alejandro Gonzales Cedeño | <strong>Unidad 3:</strong> Direccionamiento IPv6</div>
  <div>
    <span id="counter" style="margin-right: 15px; font-weight: 600; color: #94a3b8;">1 / 7</span>
    <button class="nav-btn" onclick="prev()">← Anterior</button>
    <button class="nav-btn" onclick="next()">Siguiente →</button>
  </div>
</div>

<script>
const DARK_NAVY = '#0F172A', TERRA = '#1E3A8A', BLUE = '#0284C7', LIGHT_BLUE = '#E0F2FE', BG = '#F8FAFC', INK = '#0F172A', RED = '#DC2626', LIGHT_RED = '#FEE2E2', GREEN = '#059669', LIGHT_GREEN = '#D1FAE5', WHITE = '#FFFFFF', BORDER = '#CBD5E1';

const P = 96;
const R = t => `<span class="txt-red">${t}</span>`;
const G = t => `<span class="txt-green">${t}</span>`;

const e = (t, x, y, w, h, o = {}) => Object.assign({ t, x, y, w, h }, o);
const title = (t, c) => e(t, .6, .4, 8.8, .8, { fs: 34, b: 1, c: c || TERRA, f: 'Segoe UI, sans-serif' });
const box = (t, x, y, w, h, o = {}) => e(t, x, y, w, h, Object.assign({ bg: TERRA, c: WHITE, b: 1, al: 'center', r: .1 }, o));

const hx = ['2001', '0db8', '0000', '0000', '0000', '0000', '0000', '0001'];
const opts = [
  'A)  2001:db8::0::1',
  'B)  2001:db8::1  (¡Correcta!)',
  'C)  2001:db:0:0:0:0:0:1'
];

const slides = [
  // Slide 1: Portada
  {
    bg: DARK_NAVY,
    els: [
      e('Reglas de Direccionamiento y Sintaxis IPv6', .6, .9, 8.8, 1.8, { fs: 38, b: 1, c: WHITE }),
      e('Unidad 3 · Direccionamiento IPv6 y Protocolos TCP/IP · 3.3', .6, 2.7, 8.8, .5, { fs: 20, c: '#94A3B8' }),
      e('Presentado por: Luis Alejandro Gonzales Cedeño', .6, 3.2, 8.8, .5, { fs: 22, b: 1, c: BLUE }),
      e('2001:db8::1', .6, 3.9, 8.8, 1.0, { fs: 56, b: 1, c: BLUE, s: 1, eff: 'wipe' })
    ]
  },
  // Slide 2: Sintaxis
  {
    bg: BG,
    els: [
      title('Sintaxis: 8 Hextetos'),
      ...hx.map((v, i) => box(v, .65 + i * 1.08, 1.6, .95, .9, { fs: 26, bg: i % 2 ? TERRA : BLUE, s: 1, d: i * 80, eff: 'pop' })),
      e('4 dígitos hexadecimales = 16 bits · Separados por dos puntos ( : )', .65, 2.8, 8.7, .5, { fs: 20, al: 'center', c: INK, s: 2, eff: 'fadeIn' }),
      e('8 hextetos × 16 bits = 128 bits de longitud', .6, 3.6, 8.8, 1.1, { fs: 42, b: 1, c: TERRA, al: 'center', s: 3, eff: 'wipe' })
    ]
  },
  // Slide 3: Regla 1
  {
    bg: BG,
    els: [
      title('Regla 1: Omitir Ceros a la Izquierda'),
      e('Original', 1.65, 1.3, 2.8, .4, { fs: 18, b: 1, c: RED, al: 'center' }),
      e('Simplificado', 5.55, 1.3, 2.8, .4, { fs: 18, b: 1, c: GREEN, al: 'center' }),
      ...[[R('0') + 'db8', 'db8'], [R('000') + '0', '0'], [R('000') + '1', '1']].flatMap(([a, b], r) => {
        const y = 1.8 + r * .8;
        return [
          e(a, 1.65, y, 2.8, .65, { fs: 26, bg: LIGHT_RED, bd: RED, r: .1, al: 'center', s: r + 1, eff: 'fadeIn' }),
          e('→', 4.45, y, 1.1, .65, { fs: 30, b: 1, c: TERRA, al: 'center', s: r + 1, d: 100, eff: 'fadeIn' }),
          e(b, 5.55, y, 2.8, .65, { fs: 26, b: 1, bg: LIGHT_GREEN, c: GREEN, bd: GREEN, r: .1, al: 'center', s: r + 1, d: 200, eff: 'wipe' })
        ]
      }),
      e('Forma resultante: 2001:db8:0:0:0:0:0:1', .6, 4.3, 8.8, .7, { fs: 30, b: 1, c: TERRA, al: 'center', s: 4, eff: 'wipe' })
    ]
  },
  // Slide 4: Regla 2
  {
    bg: BG,
    els: [
      title('Regla 2: Compresión con Doble Puntos ( :: )'),
      ...['2001', 'db8', '0', '0', '0', '0', '0', '1'].map((v, i) => box(v, .65 + i * 1.08, 1.4, .95, .85, { fs: 26, bg: (i > 1 && i < 7) ? LIGHT_RED : TERRA, c: (i > 1 && i < 7) ? RED : WHITE, bd: (i > 1 && i < 7) ? RED : TERRA })),
      box('2001', .65, 2.75, .95, .85, { fs: 26, s: 1, eff: 'fadeIn' }),
      box('db8', 1.73, 2.75, .95, .85, { fs: 26, s: 1, d: 100, eff: 'fadeIn' }),
      box('::', 2.81, 2.75, 5.27, .85, { fs: 34, bg: BLUE, c: WHITE, s: 1, d: 200, eff: 'wipe' }),
      box('1', 8.13, 2.75, .95, .85, { fs: 26, s: 1, d: 300, eff: 'fadeIn' }),
      e('5 hextetos de ceros continuos sustituidos por "::"', 2.81, 3.7, 5.27, .4, { fs: 18, al: 'center', c: INK, s: 1, d: 400, eff: 'fadeIn' }),
      e('2001:db8::1', .6, 4.3, 8.8, .8, { fs: 46, b: 1, c: TERRA, al: 'center', s: 2, eff: 'wipe' })
    ]
  },
  // Slide 5: Restricción del ::
  {
    bg: BG,
    els: [
      title('Restricción: Usar el "::" Una Sola Vez'),
      e('Dirección original: 2001:0000:0000:0001:0000:0000:0000:0001', .6, 1.3, 8.8, .5, { fs: 20, c: INK }),
      e('INCORRECTO\n<b style="font-size:28pt">2001::1::1</b>\nGenera ambigüedad. Imposible determinar cuántos ceros hay en cada "::".', .6, 2.0, 4.2, 2.8, { fs: 18, bg: LIGHT_RED, c: RED, bd: RED, r: .12, al: 'center', col: 1, s: 1, eff: 'wipe', html: 1 }),
      e('CORRECTO\n<b style="font-size:28pt">2001:0:0:1::1</b>\nSe usa "::" solo para el grupo más largo de ceros. Sin ambigüedad.', 5.2, 2.0, 4.2, 2.8, { fs: 18, bg: LIGHT_GREEN, c: GREEN, bd: GREEN, r: .12, al: 'center', col: 1, s: 2, eff: 'wipe', html: 1 })
    ]
  },
  // Slide 6: Quiz
  {
    bg: BG,
    els: [
      title('Evaluación de Sintaxis'),
      e('2001:0db8:0000:0000:0000:0000:0000:0001', .6, 1.3, 8.8, .6, { fs: 26, b: 1, c: TERRA }),
      e('¿Cuál es la forma abreviada correcta?', .6, 1.95, 8.8, .4, { fs: 20, c: INK }),
      ...opts.map((t, i) => e(t, .6, 2.5 + i * .85, 8.8, .7, {
        fs: 24, bg: WHITE, bd: BORDER, c: INK, r: .12, pad: .3, s: 1, d: i * 150, eff: 'fadeIn', link: i === 1 ? 6 : 4
      }))
    ]
  },
  // Slide 7: Resumen
  {
    bg: DARK_NAVY,
    els: [
      title('Resumen de Reglas', WHITE),
      e('Repetir test', 7.4, .45, 2, .4, { fs: 16, c: BLUE, al: 'right', u: 1, link: 5 }),
      ...['Eliminar todos los ceros a la izquierda.', 'Comprimir bloques continuos de ceros usando ::', 'Utilizar :: solo una vez por cada dirección IPv6.'].flatMap((t, i) => [
        box(String(i + 1), .6, 1.4 + i * .9, .7, .7, { fs: 26, bg: BLUE, c: WHITE, r: .35, s: i + 1, eff: 'pop' }),
        e(t, 1.55, 1.4 + i * .9, 7.8, .7, { fs: 24, c: WHITE, s: i + 1, d: 150, eff: 'wipe' })
      ]),
      e('2001:db8::1', .6, 4.25, 8.8, .9, { fs: 46, b: 1, c: BLUE, al: 'center', s: 4, eff: 'wipe' })
    ]
  }
];

const stage = document.getElementById('stage');
const counter = document.getElementById('counter');
const maxStep = slides.map(s => Math.max(0, ...s.els.map(x => x.s || 0)));
let cur = 0, step = 0;

// Renderizar estructura inicial en el DOM
slides.forEach((sl, si) => {
  const d = document.createElement('div');
  d.className = 'slide';
  d.style.background = sl.bg;

  sl.els.forEach(o => {
    const n = document.createElement('div');
    n.className = 'el' + (o.link != null ? ' link' : '') + (o.s ? ' hide' : '');
    
    Object.assign(n.style, {
      left: o.x * P + 'px',
      top: o.y * P + 'px',
      width: o.w * P + 'px',
      height: o.h * P + 'px',
      fontSize: (o.fs || 24) * 4 / 3 + 'px',
      color: o.c || INK,
      fontWeight: o.b ? 700 : 400,
      fontFamily: o.f || 'Segoe UI, sans-serif',
      background: o.bg || 'none',
      border: o.bd ? `2px solid ${o.bd}` : 'none',
      borderRadius: o.r ? o.r * P + 'px' : '0',
      justifyContent: o.al === 'center' ? 'center' : o.al === 'right' ? 'flex-end' : 'flex-start',
      textAlign: o.al || 'left',
      padding: (o.pad ? o.pad * P : 6) + 'px',
      textDecoration: o.u ? 'underline' : 'none'
    });

    if (o.col) {
      n.style.flexDirection = 'column';
      n.style.justifyContent = 'center';
    }

    if (o.html) n.innerHTML = o.t.replace(/\n/g, '<br>');
    else n.innerHTML = o.t;

    if (o.s) n.dataset.s = o.s;
    if (o.eff) n.dataset.eff = o.eff;
    if (o.d) n.dataset.d = o.d;

    if (o.link != null) {
      n.onclick = ev => {
        ev.stopPropagation();
        go(o.link);
      };
    }

    d.appendChild(n);
  });
  stage.appendChild(d);
});

// Lógica de control de animaciones únicas
function render() {
  counter.textContent = `${cur + 1} / ${slides.length}`;
  
  [...stage.children].forEach((d, i) => {
    const isActive = (i === cur);
    d.classList.toggle('on', isActive);

    if (isActive) {
      d.querySelectorAll('[data-s]').forEach(n => {
        const targetStep = +n.dataset.s;
        
        if (targetStep <= step) {
          if (n.classList.contains('hide')) {
            n.classList.remove('hide');
            // Si no se ha animado previamente, ejecutar la animación
            if (!n.dataset.animated) {
              n.dataset.animated = "true";
              const delay = n.dataset.d || 0;
              setTimeout(() => {
                n.classList.add('animate-' + (n.dataset.eff || 'fadeIn'));
              }, delay);
            }
          }
        } else {
          // Ocultar si el usuario retrocede
          n.classList.add('hide');
          n.classList.remove('animate-fadeIn', 'animate-wipe', 'animate-pop');
          delete n.dataset.animated;
        }
      });
    }
  });
}

function go(i) {
  cur = Math.max(0, Math.min(slides.length - 1, i));
  step = 0;
  render();
}

function next() {
  if (step < maxStep[cur]) {
    step++;
  } else if (cur < slides.length - 1) {
    cur++;
    step = 0;
  }
  render();
}

function prev() {
  if (step > 0) {
    step--;
  } else if (cur > 0) {
    cur--;
    step = maxStep[cur];
  }
  render();
}

document.addEventListener('click', next);
document.addEventListener('keydown', k => {
  if (['ArrowRight', 'ArrowDown', ' ', 'Enter', 'PageDown'].includes(k.key)) {
    k.preventDefault();
    next();
  }
  if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(k.key)) {
    k.preventDefault();
    prev();
  }
});

function fit() {
  const scale = Math.min(innerWidth / 960, (innerHeight - 36) / 540);
  stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
}

addEventListener('resize', fit);
fit();
render();
</script>
</body>
</html>
